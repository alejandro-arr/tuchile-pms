<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión · Turismo TUCHILE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 min-h-screen flex flex-col justify-center items-center p-6 antialiased">

    <div class="w-full max-w-[400px]">
        <!-- Brand Header -->
        <div class="text-center mb-8">
            <div class="w-11 h-11 rounded-2xl bg-emerald-600 text-white font-extrabold text-lg flex items-center justify-center mx-auto mb-4 shadow-sm">
                TC
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Turismo TUCHILE</h1>
            <p class="text-sm text-slate-500 mt-1">Plataforma de Gestión de Alojamientos</p>
        </div>

        <!-- Card Principal -->
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs p-8">
            {% if messages %}
                <div class="space-y-2 mb-5">
                    {% for message in messages %}
                        <div class="px-3.5 py-2.5 rounded-xl text-xs font-medium border {% if message.tags == 'error' %}bg-rose-50 text-rose-700 border-rose-200{% else %}bg-slate-50 text-slate-700 border-slate-200{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="POST" action="{% url 'login' %}" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">Correo electrónico o RUT</label>
                    <input name="identificador" type="text" placeholder="nombre@tuchile.cl" required
                           class="w-full rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-600/15 transition">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-semibold text-slate-700">Contraseña</label>
                        <a href="#" onclick="alert('Se ha enviado un enlace de recuperación a su correo institucional.')" class="text-xs font-medium text-emerald-600 hover:text-emerald-700">¿Olvidaste tu contraseña?</a>
                    </div>
                    <input name="password" type="password" placeholder="••••••••" required
                           class="w-full rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-600/15 transition">
                </div>

                <button type="submit"
                        class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold text-sm py-2.5 px-4 rounded-xl shadow-xs transition mt-2 cursor-pointer">
                    Iniciar sesión
                </button>
            </form>
        </div>

        <div class="mt-6 text-center text-xs text-slate-400">
            Turismo TUCHILE &middot; Litoral Central y Sur de Chile
        </div>
    </div>

</body>
</html>
